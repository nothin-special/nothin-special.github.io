<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NothinSpecial Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div id="profile-frame" class="profile-frame">
      <div id="loading-indicator" class="loading-text">loading...</div>
    </div>
    <div class="name">Ben Rada</div>
    <div class="description">Cybersecurity Professional | CTF Enthusiast</div>

    <div class="terminal-frame">
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
        <div id="launch-screen">
            <div>guest@localhost:~$ ./launch.sh<span id="launch-cursor" class="cursor">█</span></div>
        </div>
      <div id="launch-instruction" class="launch-text" style="display:none;">
        Press <span class="key">Enter</span> to launch the portfolio
        </div>
        <button id="tap-launch" class="launch-button" style="display:none;">Tap to Launch</button>
      <div id="inactivity-popup" class="popup-hint" style="display:none;">
        Need help? Just press <span class="key">Enter</span> to get started.
      </div>
      <div id="terminal"></div>
    </div>

    <div id="image-preview">
      <p>feh profile.jpg</p>
      <img src="./images/profile.jpg" alt="Opened Image">
    </div>

    <footer id="footer">Last updated: August 2025 | Version 1.0</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
